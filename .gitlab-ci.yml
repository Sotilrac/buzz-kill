# GitLab CI/CD for BuzzKill.
#
# Two stages:
#   verify  — one combined job: ktlint + detekt + Android Lint + unit tests + debug
#             build. Runs on every push. Uses --continue so all reports come back
#             even if one tool fails.
#
#   release — fires on a git tag (e.g. `v1.0.2`). Builds a signed release APK
#             named buzzkill-${TAG}.apk with versionName=${TAG#v}, uploads it to
#             the Generic Package Registry, and creates a GitLab Release entry.
#             Signing keystore + credentials come from CI variables (see
#             build-release below).
#
# We collapsed five lint/test/build jobs into one so we pay the docker-image
# pull cost once per pipeline instead of five times.

default:
  # mingc/android-build-box only publishes versioned tags up to 1.29.0 (April
  # 2025), too old for compileSdk 36. The maintainer pushes new builds to
  # `:latest` instead. The single-job pipeline (vs. five parallel jobs) is what
  # actually saves runtime — image pulls are per-job on SaaS shared runners
  # regardless of tag pinning.
  image: mingc/android-build-box:latest
  cache:
    key:
      files:
        - gradle/libs.versions.toml
        - gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/caches
      - .gradle/wrapper
      - .gradle/build-cache
  before_script:
    - chmod +x ./gradlew

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

# Pipelines fire only on git tag pushes. Branch pushes get no CI — local
# `./gradlew :app:ktlintCheck :app:detekt :app:testDebugUnitTest` is the
# pre-tag check. This makes the tag the single CI trigger and avoids paying
# minutes for two pipelines (one per ref) when bumping + tagging the same SHA.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - when: never

stages:
  - verify
  - build
  - release

# -- verify: lint + test, runs first on every tag pipeline ---------------

verify:
  stage: verify
  script:
    - >
      ./gradlew --continue
      :app:ktlintCheck
      :app:detekt
      :app:lintDebug
      :app:testDebugUnitTest
  artifacts:
    when: always
    paths:
      - app/build/reports/ktlint/
      - app/build/reports/detekt/
      - app/build/reports/lint-results-debug.html
      - app/build/reports/tests/
    reports:
      junit: app/build/test-results/testDebugUnitTest/TEST-*.xml
    expire_in: 1 week

# -- build: tagged APK ---------------------------------------------------

build-release:
  stage: build
  script:
    # Source of truth for versionName/versionCode is app/build.gradle.kts so
    # F-Droid's checkupdates can parse them. Assert the tag matches the gradle
    # versionName before building.
    - TAG_VERSION="${CI_COMMIT_TAG#v}"
    - GRADLE_VERSION=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
    - |
      if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
        echo "Tag $CI_COMMIT_TAG (-> $TAG_VERSION) does not match gradle versionName ($GRADLE_VERSION). Bump app/build.gradle.kts and re-tag."
        exit 1
      fi
    - echo "Building $CI_COMMIT_TAG from gradle versionName=$GRADLE_VERSION"
    # Materialize the release keystore from the base64 CI variable. The signing
    # passwords/alias are passed as ORG_GRADLE_PROJECT_BUZZKILL_* CI variables, which
    # Gradle auto-maps to the BUZZKILL_* project properties read in app/build.gradle.kts.
    - |
      if [ -z "$BUZZKILL_KEYSTORE_BASE64" ]; then
        echo "BUZZKILL_KEYSTORE_BASE64 is not set; cannot produce a signed release. Add it as a masked CI variable."
        exit 1
      fi
    - echo "$BUZZKILL_KEYSTORE_BASE64" | base64 -d > "$CI_PROJECT_DIR/buzzkill-release.jks"
    - export ORG_GRADLE_PROJECT_BUZZKILL_STORE_FILE="$CI_PROJECT_DIR/buzzkill-release.jks"
    - ./gradlew :app:assembleRelease
    - cp app/build/outputs/apk/release/app-release.apk "buzzkill-${CI_COMMIT_TAG}.apk"
    # Upload to the GitLab Generic Package Registry so the release link stays
    # valid independent of any single CI job's lifetime.
    - |
      curl --fail --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file "buzzkill-${CI_COMMIT_TAG}.apk" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/buzzkill/${CI_COMMIT_TAG}/buzzkill-${CI_COMMIT_TAG}.apk"
  artifacts:
    paths:
      - "buzzkill-*.apk"
    expire_in: never

publish-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-release
      artifacts: true
  before_script: []
  script:
    - echo "Publishing GitLab Release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "BuzzKill $CI_COMMIT_TAG"
    description: |
      Built from $CI_COMMIT_SHA. Side-load the APK below.

      ```bash
      adb install buzzkill-${CI_COMMIT_TAG}.apk
      ```
    assets:
      links:
        - name: "buzzkill-${CI_COMMIT_TAG}.apk"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/buzzkill/${CI_COMMIT_TAG}/buzzkill-${CI_COMMIT_TAG}.apk"
          link_type: package
