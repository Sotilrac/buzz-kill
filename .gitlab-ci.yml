# GitLab CI/CD for BuzzKill.
#
# Two stages:
#   verify  — one combined job: ktlint + detekt + Android Lint + unit tests + debug
#             build. Runs on every push. Uses --continue so all reports come back
#             even if one tool fails.
#
#   release — fires on a git tag (e.g. `v1.0.2`). Builds an APK named
#             buzzkill-${TAG}.apk with versionName=${TAG#v}, uploads it to the
#             Generic Package Registry, and creates a GitLab Release entry.
#
# We collapsed five lint/test/build jobs into one so we pay the docker-image
# pull cost once per pipeline instead of five times.

default:
  # mingc/android-build-box only publishes versioned tags up to 1.29.0 (April
  # 2025), too old for compileSdk 36. The maintainer pushes new builds to
  # `:latest` instead. The single-job pipeline (vs. five parallel jobs) is what
  # actually saves runtime — image pulls are per-job on SaaS shared runners
  # regardless of tag pinning.
  image: mingc/android-build-box:latest
  cache:
    key:
      files:
        - gradle/libs.versions.toml
        - gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/caches
      - .gradle/wrapper
      - .gradle/build-cache
  before_script:
    - chmod +x ./gradlew

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

stages:
  - verify
  - release

# -- verify: lint + test + build, all in one container --------------------

verify:
  stage: verify
  rules:
    # Tag pipelines run the release flow; skip the verify job there.
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    # `--continue` keeps going past the first failure so we get all reports.
    - >
      ./gradlew --continue
      :app:ktlintCheck
      :app:detekt
      :app:lintDebug
      :app:testDebugUnitTest
      :app:assembleDebug
  artifacts:
    when: always
    paths:
      - app/build/reports/ktlint/
      - app/build/reports/detekt/
      - app/build/reports/lint-results-debug.html
      - app/build/reports/tests/
      - app/build/outputs/apk/debug/*.apk
    reports:
      junit: app/build/test-results/testDebugUnitTest/TEST-*.xml
    expire_in: 1 week

# -- release: tag-only flow -----------------------------------------------

build-release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION_NAME="${CI_COMMIT_TAG#v}"
    - |
      if [[ "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
        VERSION_CODE=$(( ${BASH_REMATCH[1]}*10000 + ${BASH_REMATCH[2]}*100 + ${BASH_REMATCH[3]} ))
      else
        VERSION_CODE=$(date +%s)
      fi
    - echo "Building $CI_COMMIT_TAG → versionName=$VERSION_NAME versionCode=$VERSION_CODE"
    - ./gradlew :app:assembleDebug -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
    - cp app/build/outputs/apk/debug/app-debug.apk "buzzkill-${CI_COMMIT_TAG}.apk"
    # Upload to the GitLab Generic Package Registry so the release link stays
    # valid independent of any single CI job's lifetime.
    - |
      curl --fail --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file "buzzkill-${CI_COMMIT_TAG}.apk" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/buzzkill/${CI_COMMIT_TAG}/buzzkill-${CI_COMMIT_TAG}.apk"
  artifacts:
    paths:
      - "buzzkill-*.apk"
    expire_in: never

publish-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build-release
      artifacts: true
  before_script: []
  script:
    - echo "Publishing GitLab Release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "BuzzKill $CI_COMMIT_TAG"
    description: |
      Built from $CI_COMMIT_SHA. Side-load the APK below.

      ```bash
      adb install buzzkill-${CI_COMMIT_TAG}.apk
      ```
    assets:
      links:
        - name: "buzzkill-${CI_COMMIT_TAG}.apk"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/buzzkill/${CI_COMMIT_TAG}/buzzkill-${CI_COMMIT_TAG}.apk"
          link_type: package
