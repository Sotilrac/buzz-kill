# Required by AGP for any project consuming androidx.* artifacts.
android.useAndroidX=true

# JDK 21 from the bundled Android Studio JBR. The system /usr/lib/jvm/java-21
# install is JRE-only (no javac), so AGP can't use it.
org.gradle.java.home=/home/carlos/android-studio/jbr

# Reasonable defaults for a Compose / Kotlin app.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# Turn off non-transitive R class generation (default is on; explicit for clarity).
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
