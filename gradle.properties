# Required by AGP for any project consuming androidx.* artifacts.
android.useAndroidX=true

# Per-machine JDK pinning (e.g. to use Android Studio's bundled JBR) goes in
# ~/.gradle/gradle.properties — not here. CI runners use their own JDK.
#
# Example for ~/.gradle/gradle.properties:
#   org.gradle.java.home=/home/<you>/android-studio/jbr

# Reasonable defaults for a Compose / Kotlin app.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# Turn off non-transitive R class generation (default is on; explicit for clarity).
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
