# Required by AGP for any project consuming androidx.* artifacts.
android.useAndroidX=true

# Per-machine JDK pinning (e.g. to use Android Studio's bundled JBR) goes in
# ~/.gradle/gradle.properties — not here. CI runners use their own JDK.
#
# Example for ~/.gradle/gradle.properties:
#   org.gradle.java.home=/home/<you>/android-studio/jbr

# Reasonable defaults for a Compose / Kotlin app.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# Non-transitive R class generation (smaller, faster R class lookups).
android.nonTransitiveRClass=true
